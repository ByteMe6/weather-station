[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
    tzapu/WiFiManager
    rweather/Crypto
    madhephaestus/ESP32Encoder

build_flags =
    -DDEVICE_ID=\"changeme\"
    -DDEVICE_SECRET=\"changeme\"
    -DSEND_INTERVAL_MS=300000
    -DAPI_URL=\"https://your-vercel-app.vercel.app/api/readings\"
