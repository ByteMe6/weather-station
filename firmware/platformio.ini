; Versions are pinned so every machine (and CI) builds the identical firmware —
; an unpinned platform/lib resolving differently months apart would put
; different behavior on different fleet devices with no way to rebuild the
; binary running in the field.
[platformio]
extra_configs = secrets.ini
; pio run builds only the board; the native env is for `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.13.0
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.15
    tzapu/WiFiManager@2.0.17
    rweather/Crypto@0.4.0
    madhephaestus/ESP32Encoder@0.12.0
    bblanchon/ArduinoJson@7.4.2

; Per-device identity and backend config come from secrets.ini (gitignored) —
; copy secrets.ini.example to secrets.ini and fill it in before flashing.
; DEVICE_SECRET must never be committed.
build_flags = ${secrets.build_flags}

; Local-development board env. Identical to esp32dev except that it accepts an
; http:// backend, so you can point the device straight at a dev server on the
; LAN instead of standing up a publicly trusted certificate for it — the upload
; path pins CA roots, so a self-signed cert is not an option.
;
; Build this deliberately: `pio run -e esp32dev-local -t upload`. The flag lives
; here rather than in secrets.ini on purpose — secrets.ini is per-device and
; gets copied between them, so a relaxation living there would eventually reach
; a device sending real readings. Choosing a build target is an explicit act.
;
; A device flashed from this env prints a DEV ONLY banner on every boot.
[env:esp32dev-local]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DALLOW_INSECURE_API_URL

; Host-native env for unit tests only (pio test -e native). Runs the
; Arduino-free logic in lib/ on the host — no board, no Adafruit deps.
[env:native]
platform = native
; rweather/Crypto declares frameworks=[arduino] only; without this the LDF's
; soft compat check skips it in the framework-less native env and Ed25519.h
; is never on the include path for the tests.
lib_compat_mode = off
; Crypto's RNG.cpp includes <Arduino.h>; test/support/Arduino.h is a stub
; (millis/micros) so the library links on the host. Tests never use the RNG.
; ArduinoJson 7 requires C++11; without an explicit standard the host compiler
; defaults to an older one and every test that includes it fails to build.
build_flags = -I test/support -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    rweather/Crypto@0.4.0
