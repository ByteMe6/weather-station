; Versions are pinned so every machine (and CI) builds the identical firmware —
; an unpinned platform/lib resolving differently months apart would put
; different behavior on different fleet devices with no way to rebuild the
; binary running in the field.
[platformio]
extra_configs = secrets.ini
; pio run builds only the board; the native env is for `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.13.0
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.15
    tzapu/WiFiManager@2.0.17
    rweather/Crypto@0.4.0
    madhephaestus/ESP32Encoder@0.12.0
    bblanchon/ArduinoJson@7.4.2

; Per-device identity and backend config come from secrets.ini (gitignored) —
; copy secrets.ini.example to secrets.ini and fill it in before flashing.
; DEVICE_SECRET must never be committed.
build_flags = ${secrets.build_flags}

; Host-native env for unit tests only (pio test -e native). Runs the
; Arduino-free logic in lib/ on the host — no board, no Adafruit deps.
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    rweather/Crypto@0.4.0
