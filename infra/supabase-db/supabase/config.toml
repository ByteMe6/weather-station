project_id = "weather-station"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true

# Web auth is Clerk (PRD W1, MRP-17/19), integrated via Supabase third-party
# auth: PostgREST/Realtime verify Clerk's JWTs against this domain's JWKS and
# `auth.jwt() ->> 'sub'` is the Clerk user id (see current_app_user_id()).
# The Clerk session token must carry {"role": "authenticated"} (Clerk dashboard
# -> Sessions -> Customize session token) or every request is treated as anon.
[auth.third_party.clerk]
enabled = true
domain = "trusted-longhorn-13.clerk.accounts.dev"

# Required, not optional: 20260727102352_firmware_ota_bucket.sql inserts the
# OTA bucket into storage.buckets, so with storage off that migration - and
# therefore every db-reset:local and the CI database job - fails outright with
# `relation "storage.buckets" does not exist`.
[storage]
enabled = true

# Disabled: the vector/analytics (logflare) container bind-mounts the host
# docker socket, which fails under Colima's virtiofs mount type. Not needed
# for local dev.
[analytics]
enabled = false

# Telegram calls the webhook directly and carries no Supabase JWT, so the
# gateway must not reject it; the function authenticates every update itself
# via grammY's webhook secret token (BOT_WEBHOOK_SECRET).
[functions.telegram-bot]
verify_jwt = false

# The dispatcher is called by pg_cron via pg_net with an x-cron-secret
# header (no Supabase JWT), so the gateway must not reject it.
[functions.alert-dispatcher]
verify_jwt = false
