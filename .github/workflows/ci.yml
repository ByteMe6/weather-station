name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack must be active before setup-node resolves the Yarn 4 cache dir
      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn check-types

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  database:
    name: Database (migrations + RLS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/supabase-db
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Apply migrations
        run: yarn db-reset:local

      - name: Run pgTAP RLS suite
        run: yarn test:db

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/supabase-db/supabase/functions/telegram-bot
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: deno check index.ts

      - name: Lint
        run: deno lint

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pipx install platformio

      - name: Build
        run: |
          cp secrets.ini.example secrets.ini
          pio run
