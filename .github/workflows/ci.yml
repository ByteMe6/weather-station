name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck web
        run: yarn workspace web typecheck

      - name: Typecheck bot
        run: yarn workspace bot typecheck

      - name: Lint web
        run: yarn workspace web lint

      - name: Lint bot
        run: yarn workspace bot lint
